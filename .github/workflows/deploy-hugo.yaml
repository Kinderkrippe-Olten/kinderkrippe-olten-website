name: Deploy Hugo site to Pages
on:
  # Only main is published, and branch work is checked through its pull request.
  # Triggering on every branch push as well would build the same commit twice --
  # which is the sole reason the old check-pr job existed, spinning up a whole
  # extra VM on every run to suppress the duplicate it had itself created.
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  # Manual deploy button, and how sync-stellen.yaml asks for a rebuild: its push is
  # made with GITHUB_TOKEN, which does not trigger workflows, and workflow_dispatch
  # is the documented exception.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.158.0
      DART_SASS_VERSION: 1.98.0
    steps:
      - name: Install Hugo
        run: |
          curl -LJO https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz
          tar -xf dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz
          cp -r dart-sass/* /usr/local/bin
          rm -rf dart-sass*
          sudo apt install musl
          wget -O hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i hugo.deb

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0  # the fork-PR check diffs base.sha against head.sha

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # For fork PRs, verify the contents are safe
      - name: Verify fork PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "Running security checks for fork PR..."

          echo "1. Checking for suspicious files..."
          SUSPICIOUS_FILES=$(find . -type f -name "*.php" -o -name "*.cgi" -o -name "*.sh" -o -name "*.exe" -o -name "*.dll" || true)
          if [ ! -z "$SUSPICIOUS_FILES" ]; then
            echo "Error: Found potentially suspicious files:"
            echo "$SUSPICIOUS_FILES"
            exit 1
          fi

          echo "2. Checking for changes outside allowed paths..."
          CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }})
          # Adjust these patterns based on your repository structure
          ALLOWED_PATTERNS="^content/|^static/|^layouts/|^data/|^i18n/|^assets/"
          SUSPICIOUS_PATHS=$(echo "$CHANGED_FILES" | grep -vE "$ALLOWED_PATTERNS" || true)
          if [ ! -z "$SUSPICIOUS_PATHS" ]; then
            echo "Error: Changes detected outside allowed directories:"
            echo "$SUSPICIOUS_PATHS"
            exit 1
          fi

          echo "3. Checking repository size..."
          TOTAL_SIZE=$(du -sm . | cut -f1)
          if [ $TOTAL_SIZE -gt 500 ]; then
            echo "Error: Repository size exceeds 500MB limit"
            exit 1
          fi

          echo "4. Validating Hugo configuration..."
          if ! hugo config; then
            echo "Error: Invalid Hugo configuration"
            exit 1
          fi

          echo "5. Checking for suspicious config changes..."
          if git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} | grep -q 'config\.'; then
            echo "Warning: Configuration file changes detected"
            CONFIG_CHANGES=$(git diff ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} -- config.*)
            echo "$CONFIG_CHANGES"

            # Check for suspicious patterns
            if echo "$CONFIG_CHANGES" | grep -iE "curl|wget|http|exec|eval|system|rm|remove|delete"; then
              echo "Error: Suspicious patterns found in config changes"
              exit 1
            fi
          fi

          echo "6. Checking for large files..."
          LARGE_FILES=$(find . -type f -size +10M)
          if [ ! -z "$LARGE_FILES" ]; then
            echo "Error: Found files larger than 10MB:"
            echo "$LARGE_FILES"
            exit 1
          fi

          echo "7. Checking for binary files..."
          BINARY_FILES=$(find . -type f -exec file {} \; | grep "executable" || true)
          if [ ! -z "$BINARY_FILES" ]; then
            echo "Error: Found binary executable files:"
            echo "$BINARY_FILES"
            exit 1
          fi

          echo "8. Validating content structure..."
          # Add checks specific to your Hugo site structure
          if [ ! -d "content" ]; then
            echo "Error: Missing content directory"
            exit 1
          fi

          echo "Security checks passed!"

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          set -euo pipefail
          hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Add CNAME file for custom domain
        run: |
          echo "kinderkrippe-olten.ch" > public/CNAME

      - name: Add robots.txt
        run: |
          cat > public/robots.txt << 'EOL'
          User-agent: *
          Allow: /
          Sitemap: https://kinderkrippe-olten.ch/sitemap.xml
          EOL

      # Only main is ever published. Branch and PR runs build to prove the site
      # still compiles and then stop here -- no artifact, so the deploy job below
      # is skipped for them. Keyed on the ref rather than the event name so that
      # push-to-main and workflow_dispatch-on-main are treated identically and a
      # new trigger cannot accidentally publish.
      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public
          retention-days: 7

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    # Publish main only, whether the run came from a push or from the
    # workflow_dispatch that sync-stellen.yaml uses to ask for a rebuild. Branch
    # and PR runs upload no artifact, so there would be nothing to deploy anyway.
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
