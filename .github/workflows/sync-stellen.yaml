name: Sync Stellen from OpenCloud

# Mirrors the job-ad PDFs from the OpenCloud space into content/docs/stellen/.
# OpenCloud is the source of truth: dropping a PDF in the folder publishes the ad,
# deleting it takes the ad down. See
# docs/superpowers/specs/2026-08-10-opencloud-stellen-sync-design.md
#
# GitHub suppresses workflow triggers for pushes made with GITHUB_TOKEN, so pushing
# alone would sync the files but never rebuild the site. workflow_dispatch is the
# documented exception to that suppression, so this workflow pushes and then
# explicitly dispatches deploy-hugo.yaml.
#
# A deploy key would have avoided the extra step, but deploy keys are disabled
# org-wide. This is arguably better anyway: no long-lived credential exists to leak,
# rotate or silently expire.

# Normal publishing is event-driven: a listener in the cluster watches OpenCloud's
# NATS stream and calls workflow_dispatch here within seconds of a change. See
# docs/superpowers/specs/2026-08-11-stellen-sync-trigger-design.md
#
# The cron below is the third and weakest net, behind that listener and the daily
# heartbeat CronJob that runs beside it. It is NOT the thing to rely on: GitHub
# disables scheduled workflows in public repositories after 60 days without
# repository activity, and this repository goes quiet during exactly the stretch
# where a backstop would matter. What it does have is a visible failure -- a red
# run in the Actions tab, with no monitoring to build -- which is why it stays.
on:
  schedule:
    - cron: '17 5 * * 1'   # UTC, Mondays; off-round minute avoids GitHub's top-of-hour congestion
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Fetch and validate only -- do not commit or push'
        type: boolean
        default: false
      allow_empty:
        description: 'Permit removing the last remaining job ads (overrides the wipeout guard)'
        type: boolean
        default: false

permissions:
  contents: write   # commit the synced PDFs
  actions: write    # dispatch deploy-hugo.yaml afterwards

concurrency:
  group: sync-stellen
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      # Pinned and checksum-verified rather than piping an install script into a
      # root shell. 'infinitescale' is absent from older rclone builds.
      #
      # Deliberately NOT named RCLONE_*: rclone maps every RCLONE_<FLAG> environment
      # variable onto the corresponding flag, so RCLONE_VERSION is read as
      # --version=v1.75.0 and dies on "strconv.ParseBool".
      PIN_RCLONE_VERSION: v1.75.0
      PIN_RCLONE_SHA256: aa2804e08f48250e71009c727124b6341cd0288465804a9a09d14663cabafbaa

      # Folder inside the space that holds the per-site directories. The space root
      # also contains OpenCloud's own .space/ metadata, so pointing at the root
      # would fetch that too and find no site folders. Kept here rather than baked
      # into the URL secret so the layout is visible in review.
      OPENCLOUD_PATH: Stellenanzeigen

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install rclone
        run: |
          set -euo pipefail
          dir="rclone-${PIN_RCLONE_VERSION}-linux-amd64"
          curl -fsSLO "https://downloads.rclone.org/${PIN_RCLONE_VERSION}/${dir}.zip"
          echo "${PIN_RCLONE_SHA256}  ${dir}.zip" | sha256sum -c -
          unzip -q "${dir}.zip"
          sudo install -m 0755 "${dir}/rclone" /usr/local/bin/rclone
          rm -rf "${dir}" "${dir}.zip"
          rclone version | head -1

      - name: Fetch job ads from OpenCloud
        env:
          RCLONE_CONFIG_OC_TYPE: webdav
          RCLONE_CONFIG_OC_VENDOR: infinitescale
          # Passed as environment values, never spliced into a command line: the
          # space ID contains a literal '$', which a double-quoted shell string
          # would expand away and turn into a silently wrong URL.
          RCLONE_CONFIG_OC_URL: ${{ secrets.OPENCLOUD_WEBDAV_URL }}
          RCLONE_CONFIG_OC_USER: ${{ secrets.OPENCLOUD_USER }}
          OPENCLOUD_TOKEN: ${{ secrets.OPENCLOUD_TOKEN }}
        run: |
          set -euo pipefail
          # An empty secret surfaces as an opaque "401 Unauthorized" three retries
          # later. `gh secret set NAME` with no stdin silently stores an empty value,
          # which is an easy mistake to make and a slow one to diagnose.
          for v in RCLONE_CONFIG_OC_URL RCLONE_CONFIG_OC_USER OPENCLOUD_TOKEN; do
            if [ -z "${!v:-}" ]; then
              echo "::error::secret behind $v is empty -- set it in Settings > Secrets and variables > Actions"
              exit 1
            fi
          done

          mkdir -p staging
          # rclone expects an obscured password in config, so obscure the App Token
          # at runtime; the secret itself holds the plain token.
          RCLONE_CONFIG_OC_PASS="$(rclone obscure "$OPENCLOUD_TOKEN")"
          export RCLONE_CONFIG_OC_PASS
          # copy, not sync: staging starts empty on an ephemeral runner, so there is
          # nothing for sync's deletion pass to do. The mirror's deletions happen in
          # the repository, where the wipeout guard can see them.
          rclone copy "OC:${OPENCLOUD_PATH}" staging --max-size 25M --transfers 4 --stats-one-line -v
          echo "--- fetched ---"
          find staging -type f -printf '%P\n' | sort

      - name: Apply to the repository
        id: apply
        env:
          DRY_RUN: ${{ inputs.dry_run || false }}
          ALLOW_EMPTY: ${{ inputs.allow_empty || false }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$DRY_RUN" = "true" ]; then flags+=(--dry-run); fi
          if [ "$ALLOW_EMPTY" = "true" ]; then flags+=(--allow-empty); fi

          set +e
          python3 scripts/apply-stellen-sync.py --staging staging "${flags[@]}" \
            | tee apply-report.txt
          rc=${PIPESTATUS[0]}
          set -e

          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # 0 = clean, 1 = applied but something was rejected (commit anyway, fail at
          # the end), 2 = could not run, 3 = wipeout guard tripped. Stop now on 2/3
          # so nothing is committed.
          if [ "$rc" -ge 2 ]; then exit "$rc"; fi

      - name: Commit and push
        id: commit
        if: ${{ inputs.dry_run != true }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain content/docs/stellen)" ]; then
            echo "no changes to commit"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "kko-websyncer[bot]"
          git config user.email "websyncer@kinderkrippe-olten.ch"
          git add -A content/docs/stellen
          git commit -F - <<EOF
          Sync job ads from OpenCloud

          $(cat apply-report.txt)

          Applied automatically by .github/workflows/sync-stellen.yaml
          EOF
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # The push above was made with GITHUB_TOKEN, which does not trigger workflows,
      # so the deploy has to be asked for explicitly -- workflow_dispatch being the
      # documented exception. That makes pushing and deploying two separate actions,
      # and a run that dies between them (runner failure, manual cancel, a gh API
      # error) used to strand the commit permanently: the ad sat on main undeployed,
      # and every later run exited at "no changes to commit" before reaching the
      # dispatch. Nothing recovered it but an unrelated ad change.
      #
      # So when this run pushed, dispatch as before; when it did not, check whether a
      # previous run left something undeployed and heal it.
      - name: Trigger the deploy, healing a stranded commit if needed
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ github.token }}
          PUSHED: ${{ steps.commit.outputs.pushed }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"

          if [ "$PUSHED" = "true" ]; then
            gh workflow run deploy-hugo.yaml --ref "${GITHUB_REF_NAME}"
            echo "deploy-hugo.yaml dispatched on ${GITHUB_REF_NAME} for ${head}"
            exit 0
          fi

          # Nothing changed this run. Only ever heal a commit this workflow made
          # itself: a human commit whose build fails for its own reasons must not be
          # re-dispatched on every run forever.
          if [ "$(git log -1 --format='%an')" != "kko-websyncer[bot]" ]; then
            echo "no changes, and HEAD is not ours -- nothing to do"
            exit 0
          fi

          # Best-effort: if the API cannot be reached, leave it for the next run
          # rather than failing a sync that otherwise succeeded.
          deployed="$(gh api \
            "repos/${GITHUB_REPOSITORY}/deployments?environment=github-pages&per_page=1" \
            --jq '.[0].sha // empty' 2>/dev/null || true)"
          if [ -z "$deployed" ]; then
            echo "could not determine the deployed commit -- skipping the heal check"
            exit 0
          fi
          if [ "$head" = "$deployed" ]; then
            echo "already deployed at ${head}"
            exit 0
          fi

          inflight="$(gh run list --workflow=deploy-hugo.yaml --json status \
            --jq '[.[] | select(.status == "queued" or .status == "in_progress")] | length' \
            2>/dev/null || echo 0)"
          if [ "$inflight" -gt 0 ]; then
            echo "a deploy is already queued or running -- letting it finish"
            exit 0
          fi

          echo "::warning::${head} was committed by an earlier run but never deployed -- dispatching now"
          gh workflow run deploy-hugo.yaml --ref "${GITHUB_REF_NAME}"
          echo "deploy-hugo.yaml dispatched on ${GITHUB_REF_NAME} for ${head}"

      - name: Report rejected files
        if: ${{ steps.apply.outputs.rc == '1' }}
        run: |
          echo "::error::Some files in the OpenCloud folder could not be published."
          echo "The valid ads were published; see 'Apply to the repository' above for"
          echo "the offending filenames and how to correct them."
          exit 1
