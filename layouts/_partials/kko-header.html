<header
  class="uk-container-expand kko-header {{ .Store.Get `kko-header-class-extra` }}"
  uk-sticky="show-on-up: true; cls-active: kko-header-active; sel-target: .kko-header"
>
  <div class="kko-logo">
    <a href="/" class="uk-link-reset">
      {{- partial "get-svg.html" "images/kko-logo-and-name-color.svg" -}}
    </a>
  </div>

  <div class="uk-container kko-header-inner">
    <button class="kko-bookmark kko-bookmark-header">
      {{- partial "get-svg.html" "images/kko-bookmark.svg" -}}
    </button>

    <div class="kko-pulldown-menu kko-background-blue">
      {{- partial "render-menu.html" . -}}

    <script>
      const closeButtons = document.querySelectorAll(".kko-close-button");
      closeButtons.forEach((button) => {
        button.addEventListener("click", function () {
          document.body.classList.remove("kko-bookmark-active");
        });
      });

      const bookmarks = document.querySelectorAll(".kko-bookmark");
      bookmarks.forEach((bookmark) => {
        bookmark.addEventListener("click", function () {
          document.body.classList.add("kko-bookmark-active");
        });
      });
    </script>

    <!-- Search functionality -->
    <script>
    document.addEventListener('DOMContentLoaded', function() {
      const searchToggles = document.querySelectorAll('.kko-search-toggle');
      const searchOverlay = document.getElementById('kko-search-overlay');
      const searchInput = document.getElementById('kko-search-input');
      const searchResults = document.getElementById('kko-search-results');
      let searchIndex = null;
      let searchTimeout = null;

      // Load search index
      fetch('/index.json')
        .then(response => response.json())
        .then(data => {
          searchIndex = data;
        })
        .catch(error => {
          console.error('Error loading search index:', error);
        });

      // Simple search function
      function search(query) {
        if (!searchIndex || query.length < 2) {
          return [];
        }

        const searchTerm = query.toLowerCase();
        return searchIndex.filter(item => {
          return item.title.toLowerCase().includes(searchTerm) ||
                 item.content.toLowerCase().includes(searchTerm) ||
                 (item.tags && item.tags.some(tag => tag.toLowerCase().includes(searchTerm)));
        }).slice(0, 8); // Limit to 8 results
      }

      // The stretch of page text shown under a result. index.json carries each page's
      // FULL text, because that is what the matcher above searches -- so without this
      // every result rendered the whole page body.
      const EXCERPT_LENGTH = 160;

      // A window around the first match, rather than the opening of the page: a hit
      // near the end of a long article is the normal case, and showing its first
      // sentence instead tells the reader nothing about why it matched.
      function excerptFor(text, query) {
        if (!text) {
          return '';
        }
        const at = text.toLowerCase().indexOf(query.toLowerCase());
        const start = at < 0 ? 0 : Math.max(0, at - Math.floor(EXCERPT_LENGTH / 4));
        const end = start + EXCERPT_LENGTH;
        return (start > 0 ? '… ' : '') + text.slice(start, end) + (end < text.length ? ' …' : '');
      }

      // Display search results.
      //
      // Built from DOM nodes rather than an innerHTML template. The values below come
      // from index.json, which indexes every page's text -- and once the
      // Medienmitteilungen syncer is live, some of that text arrives from a Word
      // document dropped into OpenCloud rather than from this repository. textContent
      // cannot execute markup, and attaching a click listener keeps the URL out of an
      // inline onclick attribute, where a single quote in a href would otherwise close
      // the string and let the rest run as code.
      function displayResults(results, query) {
        searchResults.replaceChildren();
        if (results.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'kko-search-result';
          empty.textContent = 'Keine Ergebnisse gefunden';
          searchResults.append(empty);
        } else {
          for (const result of results) {
            const row = document.createElement('div');
            row.className = 'kko-search-result';
            row.addEventListener('click', function() {
              window.location.href = result.href;
            });
            const cells = [
              ['result-title', result.title],
              ['result-excerpt', excerptFor(result.content, query)],
              ['result-section', result.section || 'Seite'],
            ];
            for (const [className, value] of cells) {
              const cell = document.createElement('div');
              cell.className = className;
              cell.textContent = value;
              row.append(cell);
            }
            searchResults.append(row);
          }
        }
        searchResults.classList.add('show');
        searchOverlay.classList.add('has-results');
      }

      // Hide results
      function hideResults() {
        searchResults.classList.remove('show');
        searchOverlay.classList.remove('has-results');
      }

      // Open search overlay
      function openSearch() {
        searchOverlay.classList.add('active');
        document.body.classList.add('search-active');
        document.body.style.overflow = 'hidden';
        // Focus input after animation
        setTimeout(() => {
          searchInput.focus();
        }, 300);
      }

      // Close search overlay
      function closeSearch() {
        searchOverlay.classList.remove('active');
        document.body.classList.remove('search-active');
        document.body.style.overflow = '';
        searchInput.value = '';
        hideResults();
      }

      // Event listeners
      searchToggles.forEach((toggle) => {
        toggle.addEventListener('click', openSearch);
      });

      // Close on overlay background click
      if (searchOverlay) {
        searchOverlay.addEventListener('click', function(e) {
          if (e.target === searchOverlay) {
            closeSearch();
          }
        });
      }

      // Search input event listeners
      if (searchInput) {
        searchInput.addEventListener('input', function(e) {
          clearTimeout(searchTimeout);
          const query = e.target.value.trim();

          if (query.length < 2) {
            hideResults();
            return;
          }

          // Debounce search
          searchTimeout = setTimeout(() => {
            const results = search(query);
            displayResults(results, query);
          }, 300);
        });

        searchInput.addEventListener('keydown', function(e) {
          if (e.key === 'Escape') {
            closeSearch();
          }
        });
      }

      // Close search on escape key globally
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && searchOverlay.classList.contains('active')) {
          closeSearch();
        }
      });
    });
    </script>
    </div>
  </div>
</header>
