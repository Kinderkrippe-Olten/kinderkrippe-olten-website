baseURL: https://kinderkrippe-olten.ch/
title: Kinderkrippe Olten 
locale: de-ch
outputs:
  home: ["HTML", "JSON"]
params:
  # Basename of the favicon in assets/img/ -- head.html expects both
  # assets/img/<favicon>.svg and assets/img/<favicon>.png to exist.
  favicon: kko
  headercommentblock: |
    <!-- ######################################  
         Content:         Kinderkrippe Olten  
         Graphic Design:  Waldluft Kreativstudio  
         Programming:     OETIKER+PARTNER AG  
         ###################################### -->
markup:
  goldmark:
    extensions:
      extras:
        delete:
          enable: true
        subscript:
          enable: true
        superscript:
          enable: true
      strikethrough: false
    renderer:
      unsafe: true
